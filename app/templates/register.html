<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription — Terminal quantitatif</title>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-page { max-width: 400px; margin: 80px auto; padding: 0 24px; }
        .auth-page h1 { font-size: 1.5rem; margin-bottom: 6px; }
        .auth-page .sous-titre { color: var(--muted); margin-bottom: 28px; }
        .auth-form { background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; padding: 28px 24px; }
        .auth-form label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 14px; }
        .auth-form input[type=email],
        .auth-form input[type=password] { width: 100%; font: inherit; font-size: .95rem; padding: 9px 10px; border: 1px solid var(--trait); border-radius: 4px; background: var(--papier); color: var(--encre); margin-top: 4px; }
        .auth-form input:focus { border-color: var(--marine); outline: none; }
        .auth-form .bouton { width: 100%; margin-top: 8px; }
        .auth-erreur { background: var(--rouge-pale); color: var(--rouge); padding: 8px 12px; border-radius: 4px; font-size: .88rem; margin-bottom: 14px; }
        .auth-lien { text-align: center; margin-top: 16px; font-size: .88rem; color: var(--muted); }
        .auth-lien a { color: var(--marine); }
        .auth-form small { color: var(--muted); font-size: .78rem; display: block; margin-top: 2px; }
    </style>
</head>
<body>
<div class="auth-page">
    <h1>Creer un compte</h1>
    <p class="sous-titre">Terminal quantitatif</p>

    <div class="auth-form">
        {% if erreur %}
        <div class="auth-erreur">{{ erreur }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <label>
                Adresse e-mail
                <input type="email" name="email" required autocomplete="email" autofocus>
            </label>
            <label>
                Mot de passe
                <input type="password" name="password" required autocomplete="new-password" minlength="8">
                <small>8 caracteres minimum</small>
            </label>
            <label>
                Confirmer le mot de passe
                <input type="password" name="password_confirm" required autocomplete="new-password" minlength="8">
            </label>
            <button type="submit" class="bouton">Creer le compte</button>
        </form>
    </div>

    <p class="auth-lien">Deja inscrit ? <a href="/login">Se connecter</a></p>
</div>
</body>
</html>
