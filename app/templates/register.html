<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription — Terminal quantitatif</title>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        :root {
            --papier: #121211;
            --surface: #1a1a18;
            --encre: #ece8df;
            --muted: #98948a;
            --trait: #2d2c29;
            --marine: #e4dece;
            --marine-fonce: #cdc6b3;
            --rouge-pale: rgba(222, 133, 125, 0.13);
            --rouge: #de857d;
        }
        body {
            margin: 0;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--papier, #121211);
            color: var(--encre, #ece8df);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .auth-page { width: 100%; max-width: 400px; margin: 0 auto; }
        .auth-page h1 { font-size: 1.6rem; margin: 0 0 6px; font-weight: 600; color: var(--encre, #ece8df); }
        .auth-page .sous-titre { color: var(--muted, #98948a); margin: 0 0 24px; font-size: 0.95rem; }
        .auth-form { background: var(--surface, #1a1a18); border: 1px solid var(--trait, #2d2c29); border-radius: 6px; padding: 28px 24px; box-sizing: border-box; }
        .auth-form label { display: block; font-size: .85rem; color: var(--muted, #98948a); margin-bottom: 16px; }
        .auth-form input[type=email],
        .auth-form input[type=password] { width: 100%; font: inherit; font-size: .95rem; padding: 10px 12px; border: 1px solid var(--trait, #2d2c29); border-radius: 4px; background: var(--papier, #121211); color: var(--encre, #ece8df); margin-top: 6px; box-sizing: border-box; }
        .auth-form input:focus { border-color: var(--marine, #e4dece); outline: none; }
        .auth-form .bouton { width: 100%; margin-top: 10px; font: inherit; font-weight: 600; background: var(--marine, #e4dece); color: var(--papier, #121211); border: 0; border-radius: 4px; padding: 10px 18px; cursor: pointer; transition: background .15s ease; }
        .auth-form .bouton:hover { background: var(--marine-fonce, #cdc6b3); }
        .auth-erreur { background: var(--rouge-pale, rgba(222, 133, 125, 0.13)); color: var(--rouge, #de857d); padding: 10px 12px; border-radius: 4px; font-size: .88rem; margin-bottom: 16px; border: 1px solid var(--rouge, #de857d); }
        .auth-lien { text-align: center; margin-top: 20px; font-size: .88rem; color: var(--muted, #98948a); }
        .auth-lien a { color: var(--marine, #e4dece); text-decoration: none; font-weight: 500; }
        .auth-lien a:hover { text-decoration: underline; }
        .auth-form small { color: var(--muted, #98948a); font-size: .78rem; display: block; margin-top: 4px; }
    </style>
</head>
<body>
<div class="auth-page">
    <h1>Créer un compte</h1>
    <p class="sous-titre">Terminal quantitatif</p>

    <div class="auth-form">
        {% if erreur %}
        <div class="auth-erreur">{{ erreur }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <label>
                Adresse e-mail
                <input type="email" name="email" required autocomplete="email" autofocus>
            </label>
            <label>
                Mot de passe
                <input type="password" name="password" required autocomplete="new-password" minlength="8">
                <small>8 caractères minimum</small>
            </label>
            <label>
                Confirmer le mot de passe
                <input type="password" name="password_confirm" required autocomplete="new-password" minlength="8">
            </label>
            <button type="submit" class="bouton">Créer le compte</button>
        </form>
    </div>

    <p class="auth-lien">Déjà inscrit ? <a href="/login">Se connecter</a></p>
</div>
</body>
</html>
